<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IP Monitor</title>
    <style>
      :root {
        --bg: #070a12;
        --panel: rgba(255, 255, 255, 0.06);
        --stroke: rgba(255, 255, 255, 0.12);
        --text0: rgba(255, 255, 255, 0.92);
        --text1: rgba(255, 255, 255, 0.72);
        --text2: rgba(255, 255, 255, 0.56);
        --good: #22c55e;
        --warn: #f59e0b;
        --bad: #f43f5e;
        --accentA: #22d3ee;
        --accentB: #0c68eb;
        --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New",
          monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 360px;
        background: radial-gradient(600px 320px at 18% 10%, rgba(34, 211, 238, 0.14), transparent 60%),
          radial-gradient(600px 320px at 85% 15%, rgba(12, 104, 235, 0.12), transparent 60%), var(--bg);
        color: var(--text0);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      }
      .card {
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .brand {
        display: grid;
        gap: 2px;
      }
      .brandRow {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brandIcon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        object-fit: contain;
        filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.55));
      }
      .brand b {
        letter-spacing: -0.2px;
      }
      .brand span {
        color: var(--text2);
        font-size: 12px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text1);
        font-size: 12px;
        white-space: nowrap;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--warn);
        box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.18);
      }
      .panel {
        border-radius: 16px;
        border: 1px solid var(--stroke);
        background: rgba(255, 255, 255, 0.04);
        padding: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .row:first-child {
        border-top: none;
      }
      .k {
        color: var(--text2);
        font-size: 12px;
      }
      .v {
        font-family: var(--mono);
        font-size: 12px;
        color: rgba(233, 236, 255, 0.92);
        word-break: break-word;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      button,
      select,
      a.btn {
        height: 38px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text0);
        padding: 0 12px;
        font-weight: 850;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      button.primary,
      a.btn.primary {
        border-color: rgba(34, 211, 238, 0.35);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(12, 104, 235, 0.14));
      }
      button.good {
        border-color: rgba(34, 197, 94, 0.35);
        background: rgba(34, 197, 94, 0.12);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      select {
        font-weight: 800;
        padding: 0 10px;
      }
      .soundMenuWrap {
        position: relative;
      }
      .soundMenuBtn {
        min-width: 160px;
        justify-content: space-between;
      }
      .soundMenuBtnText {
        font-weight: 900;
        color: rgba(233, 236, 255, 0.92);
      }
      .soundMenuBtnCaret {
        opacity: 0.7;
        color: var(--text2);
      }
      .soundMenu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        z-index: 50;
        width: 320px;
        max-width: 86vw;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(7, 10, 18, 0.98);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.65);
        padding: 10px;
        display: grid;
        gap: 8px;
      }
      .soundMenuTop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 2px 6px;
      }
      .soundMenuTitle {
        font-weight: 950;
        font-size: 12px;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--text2);
      }
      .soundMenuHint {
        font-size: 12px;
        color: var(--text2);
      }
      .soundOption {
        height: 38px;
        justify-content: flex-start;
        padding: 0 12px;
        font-weight: 900;
        letter-spacing: 0.15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.05);
        color: rgba(233, 236, 255, 0.92);
      }
      .soundOption.isActive {
        border-color: rgba(34, 211, 238, 0.35);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(12, 104, 235, 0.1));
      }
      .soundMenu.isHidden {
        display: none;
      }
      .hint {
        margin-top: 8px;
        color: var(--text2);
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="top">
        <div class="brandRow">
          <img class="brandIcon" src="ip-monitor-icon.png" alt="IP Monitor" />
          <div class="brand">
            <b>IP Monitor</b>
            <span>Browser extension</span>
          </div>
        </div>
        <div class="pill" title="Status">
          <span id="dot" class="dot" aria-hidden="true"></span>
          <span id="state">—</span>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <div class="k">Current IP</div>
          <div class="v" id="ip">—</div>
        </div>
        <div class="row">
          <div class="k">Changes detected</div>
          <div class="v" id="changes">0</div>
        </div>
        <div class="row">
          <div class="k">Last change</div>
          <div class="v" id="last">—</div>
        </div>
      </div>

      <div class="panel">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <div style="font-weight: 900; letter-spacing: -0.2px">Controls</div>
          <button id="btnCheck" type="button">Check now</button>
        </div>

        <div class="controls">
          <button id="btnToggle" class="primary" type="button">—</button>
          <button id="btnSound" class="good" type="button">—</button>
          <div class="soundMenuWrap" id="soundMenuWrap">
            <button id="soundMenuBtn" class="soundMenuBtn" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="soundMenuBtnText" id="soundMenuBtnText">Sound</span>
              <span class="soundMenuBtnCaret" aria-hidden="true">▾</span>
            </button>
            <div id="soundMenu" class="soundMenu isHidden" role="menu" aria-label="Sounds"></div>
          </div>
        </div>
        <div class="hint">Sound requires a click to enable. IP Monitor will send a browser notification when your IP changes.</div>
      </div>

      <a class="btn" href="https://programmerfullstack.com/projects/IP%20monitor/" target="_blank" rel="noreferrer">
        Open web app
      </a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
